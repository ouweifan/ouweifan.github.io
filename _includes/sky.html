<!-- 扁平化昼夜天空背景：固定铺底，置于所有内容之后。
     渐变底分白天/夜晚两层交叉淡变；云为共享层（昼夜都在、位置连续）；
     太阳/月亮挂在共用轨道两端，切主题整体旋转升落互换。
     纯装饰，aria-hidden，不进无障碍树。形状用内联 SVG，动效用 CSS。 -->
<div class="sky" aria-hidden="true">

  <!-- 渐变底：白天 -->
  <div class="sky-layer sky-day"></div>

  <!-- 渐变底：夜晚 + 星空 + 流星（仅夜间，随本层淡出） -->
  <div class="sky-layer sky-night">
    <svg class="stars" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice">
      <circle cx="989" cy="62" r="1.3"/><circle cx="207" cy="197" r="1.2"/><circle cx="876" cy="549" r="0.9"/><circle cx="1062" cy="155" r="0.6"/><circle cx="221" cy="611" r="0.6"/><circle cx="673" cy="130" r="1.3"/><circle cx="653" cy="41" r="1.2"/><circle cx="609" cy="508" r="1.2"/><circle cx="432" cy="28" r="1.2"/><circle cx="302" cy="411" r="0.8"/>
      <circle cx="1076" cy="531" r="1.1"/><circle cx="152" cy="133" r="1.3"/><circle cx="1022" cy="693" r="1.0"/><circle cx="1039" cy="397" r="0.6"/><circle cx="839" cy="378" r="1.3"/><circle cx="621" cy="577" r="1.3"/><circle cx="664" cy="89" r="1.1"/><circle cx="304" cy="666" r="0.9"/><circle cx="654" cy="717" r="0.8"/><circle cx="474" cy="398" r="0.5"/>
      <circle cx="489" cy="721" r="0.6"/><circle cx="1092" cy="789" r="1.3"/><circle cx="1047" cy="486" r="1.1"/><circle cx="683" cy="253" r="1.0"/><circle cx="930" cy="106" r="1.1"/><circle cx="920" cy="78" r="0.8"/><circle cx="1196" cy="513" r="1.0"/><circle cx="80" cy="324" r="1.0"/><circle cx="409" cy="534" r="1.0"/><circle cx="181" cy="189" r="1.3"/>
      <circle cx="971" cy="101" r="0.8"/><circle cx="276" cy="543" r="1.1"/><circle cx="125" cy="200" r="1.3"/><circle cx="833" cy="99" r="0.7"/><circle cx="781" cy="701" r="0.9"/><circle cx="448" cy="448" r="1.2"/><circle cx="1074" cy="628" r="0.6"/><circle cx="291" cy="621" r="0.7"/><circle cx="49" cy="625" r="1.3"/><circle cx="125" cy="227" r="1.1"/>
      <circle cx="792" cy="295" r="0.9"/><circle cx="746" cy="538" r="0.6"/><circle cx="434" cy="51" r="0.6"/><circle cx="161" cy="378" r="0.5"/><circle cx="806" cy="455" r="0.7"/><circle cx="640" cy="729" r="1.3"/><circle cx="78" cy="629" r="1.2"/><circle cx="235" cy="261" r="0.6"/><circle cx="589" cy="672" r="0.8"/><circle cx="793" cy="463" r="0.8"/>
      <circle cx="809" cy="740" r="0.5"/><circle cx="796" cy="339" r="1.3"/><circle cx="657" cy="730" r="1.2"/><circle cx="1173" cy="109" r="0.6"/><circle cx="269" cy="637" r="0.6"/><circle cx="654" cy="438" r="0.9"/><circle cx="1154" cy="50" r="1.3"/><circle cx="1015" cy="140" r="0.7"/><circle cx="1191" cy="620" r="1.4"/><circle cx="203" cy="416" r="0.5"/>
      <circle cx="94" cy="618" r="0.6"/><circle cx="735" cy="536" r="1.3"/><circle cx="914" cy="152" r="1.4"/><circle cx="589" cy="638" r="0.5"/><circle cx="1078" cy="534" r="1.2"/><circle cx="947" cy="314" r="1.3"/><circle cx="840" cy="601" r="1.3"/><circle cx="158" cy="577" r="1.4"/><circle cx="112" cy="788" r="1.1"/><circle cx="856" cy="713" r="0.8"/>
      <circle cx="698" cy="545" r="0.6"/><circle cx="405" cy="615" r="0.6"/><circle cx="301" cy="233" r="1.0"/><circle cx="66" cy="53" r="1.0"/><circle cx="653" cy="261" r="0.6"/><circle cx="460" cy="270" r="0.9"/><circle cx="151" cy="718" r="0.6"/><circle cx="454" cy="404" r="0.5"/><circle cx="929" cy="593" r="1.3"/><circle cx="1130" cy="225" r="1.2"/>
      <circle cx="307" cy="586" r="1.1"/><circle cx="616" cy="653" r="1.3"/><circle cx="777" cy="438" r="1.1"/><circle cx="58" cy="346" r="0.7"/><circle cx="816" cy="267" r="1.2"/><circle cx="901" cy="122" r="0.8"/><circle cx="719" cy="756" r="1.1"/><circle cx="671" cy="394" r="1.0"/><circle cx="1179" cy="328" r="1.0"/><circle cx="612" cy="777" r="0.7"/>
      <circle cx="356" cy="704" r="1.1"/><circle cx="449" cy="101" r="1.4"/>
    </svg>
    <span class="shooting-star ss-1"></span>
    <span class="shooting-star ss-2"></span>
  </div>

  <!-- 云：共享层，昼夜都可见、位置连续；6 种各异轮廓 + 视差分层。
       外层 .cloud 横漂，内层 <svg> 起伏呼吸（两层分担 transform，互不冲突）。 -->
  <div class="clouds">
    <!-- 1 近：宽多峰积云 -->
    <div class="cloud cloud-1"><svg viewBox="0 0 260 110"><g class="cloud-shape">
      <ellipse cx="52"  cy="74" rx="44" ry="26"/>
      <ellipse cx="104" cy="52" rx="52" ry="40"/>
      <ellipse cx="158" cy="62" rx="46" ry="32"/>
      <ellipse cx="206" cy="74" rx="38" ry="24"/>
      <rect x="44" y="70" width="200" height="30" rx="15"/>
    </g></svg></div>

    <!-- 2 中：高耸团云 -->
    <div class="cloud cloud-2"><svg viewBox="0 0 200 120"><g class="cloud-shape">
      <ellipse cx="70"  cy="82" rx="44" ry="28"/>
      <ellipse cx="110" cy="50" rx="50" ry="42"/>
      <ellipse cx="150" cy="78" rx="40" ry="30"/>
      <rect x="58" y="78" width="120" height="32" rx="16"/>
    </g></svg></div>

    <!-- 3 远：小圆云 -->
    <div class="cloud cloud-3"><svg viewBox="0 0 160 100"><g class="cloud-shape">
      <ellipse cx="54"  cy="64" rx="34" ry="24"/>
      <ellipse cx="96"  cy="50" rx="40" ry="32"/>
      <ellipse cx="130" cy="66" rx="28" ry="20"/>
      <rect x="46" y="62" width="96" height="26" rx="13"/>
    </g></svg></div>

    <!-- 4 近：狭长歪云 -->
    <div class="cloud cloud-4"><svg viewBox="0 0 300 100"><g class="cloud-shape">
      <ellipse cx="58"  cy="68" rx="40" ry="22"/>
      <ellipse cx="120" cy="50" rx="54" ry="36"/>
      <ellipse cx="186" cy="58" rx="48" ry="30"/>
      <ellipse cx="244" cy="70" rx="40" ry="24"/>
      <ellipse cx="284" cy="76" rx="20" ry="14"/>
      <rect x="48" y="66" width="248" height="28" rx="14"/>
    </g></svg></div>

    <!-- 5 中：双峰云 -->
    <div class="cloud cloud-5"><svg viewBox="0 0 240 100"><g class="cloud-shape">
      <ellipse cx="56"  cy="62" rx="40" ry="28"/>
      <ellipse cx="96"  cy="72" rx="30" ry="20"/>
      <ellipse cx="156" cy="56" rx="46" ry="34"/>
      <ellipse cx="202" cy="68" rx="34" ry="22"/>
      <rect x="46" y="66" width="176" height="24" rx="12"/>
    </g></svg></div>

    <!-- 6 远：扁薄丝云 -->
    <div class="cloud cloud-6"><svg viewBox="0 0 200 90"><g class="cloud-shape">
      <ellipse cx="56"  cy="58" rx="38" ry="20"/>
      <ellipse cx="104" cy="48" rx="44" ry="28"/>
      <ellipse cx="150" cy="58" rx="34" ry="20"/>
      <rect x="46" y="56" width="120" height="20" rx="10"/>
    </g></svg></div>
  </div>

  <!-- 轨道：太阳/月亮挂在共用圆弧两端，主题切换整体旋转 ~180° 升落互换 -->
  <div class="orbit">
    <div class="arm arm-sun">
      <svg class="sun" viewBox="0 0 200 200">
        <defs>
          <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
            <stop offset="38%" stop-color="rgba(255,214,102,.55)"/>
            <stop offset="100%" stop-color="rgba(255,214,102,0)"/>
          </radialGradient>
        </defs>
        <circle class="sun-halo" cx="100" cy="100" r="98" fill="url(#sunGlow)"/>
        <circle class="sun-disk" cx="100" cy="100" r="46"/>
      </svg>
    </div>

    <div class="arm arm-moon">
      <svg class="moon" viewBox="0 0 200 200">
        <defs>
          <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
            <stop offset="46%" stop-color="rgba(245,243,224,.42)"/>
            <stop offset="100%" stop-color="rgba(245,243,224,0)"/>
          </radialGradient>
          <!-- 亮区=白→露出月盘，暗区=透明→露出渐变天空。d 由 app.js 按真实月相写入；
               下方为无 JS 兜底（盈蛾眉月，右侧亮）。 -->
          <mask id="moonMask">
            <path id="moonLit" fill="#fff"
                  d="M100,42 A58,58 0 0 1 100,158 A17.4,58 0 0 0 100,42 Z"/>
          </mask>
        </defs>
        <circle class="moon-halo" cx="100" cy="100" r="96" fill="url(#moonGlow)"/>
        <circle class="moon-disk" cx="100" cy="100" r="58" mask="url(#moonMask)"/>
      </svg>
    </div>
  </div>

</div>
