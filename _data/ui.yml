en:
  nav_home: "Home"
  nav_about: "About"
  tagline: "Models · Figures · Photography · Games · Anime"
  bio: |
    Hi, I'm Vanadium, probably yet another giant robot anime nerd somewhere in your orbit.
    Welcome to my little site. I'll use this place to share some of the models, figures, and finished toys I've photographed or built. My tastes are fairly scattered, so a bit of everything may show up here; my craft is nothing too polished either, but hopefully the results are at least pleasant enough to look at.
    My interest in models and photography probably goes back to watching Mashin Hero Wataru and Granzort on TV. Like many kids my age, I bought anime-related toys, ran around with those robots in hand, and tried to pose them as if they were in battle.
    Later, I saw the Doraemon episode about taking ultra-realistic diorama photos. The idea of photographing toys with practical effects and miniature scenes felt like a door opening. It was the first time I realized that I could present the machines I loved in a way that made them feel heroic.
    So I painted weathering onto my domestic Ryujinmaru with oil paint, in a way that looked more like mud smeared across a wall; cut silhouettes of ruined buildings out of A4 paper; built an extremely simple pure-white scene; and secretly borrowed the family compact camera to take my first toy photo.
    The result was probably even rougher than Nobita's first photo that Suneo laughed at. But for the first time, the toy in my hands seemed a little closer to the impression I had of it in the original work. That small hit of self-satisfaction has stayed with me ever since.
    In middle school, I bought the October 2012 Chinese edition of Dengeki Hobby from a newsstand on my way home from school. Unsurprisingly, I was completely drawn in by the photography effects and modeling techniques printed in those pages. From then on, I became a loyal reader of Dengeki Hobby and Hobby Japan, rarely missing an issue until Dengeki ended publication and I later went abroad to study.
    Back then, I badly wanted to become the kind of modeler, photographer, and editor I saw in those magazines: documenting the build with a camera and words, then using edited images to recreate memorable scenes from the source material with the toy in my hands. Because of money, all I could really do at the time was straight builds, photos from an iTouch camera, and beam effects made in random APP. It was crude, but I had a lot of fun.
    After that came high school, college, grad school, and work. I gradually learned more advanced techniques like airbrushing, started using Photoshop, and bought better cameras and lenses. But because of some personal bad habits, I often kept postponing the things I truly wanted to do. I kept telling myself there would always be time later, that I should first "work hard" and handle the "serious things", as if that could ease the anxiety of the present. Between those thoughts and various real-life constraints, models and photography stopped and started several times. As I write this, I have not properly built a model or taken photos for more than a year. Honestly, my hands are itching.
    It is now July 4, 2026, and I am about to enter a new stage of life. If nothing unexpected happens, I should finally be able to start building models again.
    As a small marker of that turning point, I put together this slightly random-looking personal blog to record these hobbies of mine. Most of what is here for now comes from the backlog I have accumulated over the years; later on, I plan to slowly share works in progress, finished builds, figures, completed toys, and maybe the occasional bit of personal rambling.
    This place is, in a way, an archive for myself: an archive of those small moments of satisfaction when a photo finally works, and also a quiet memorial to the dreams that once seemed a little unrealistic, but that I never truly let go of.
zh:
  nav_home: "首页"
  nav_about: "关于我"
  tagline: "模型・手办・摄影・游戏・动画"
  bio: |
    你好，我是 Vanadium，大概是你认识的又一个大机器人动画片痴。
    欢迎来到我的小站。我会在这里分享一些自己拍摄或制作的模型、手办和成品玩具。个人口味很杂，基本什么题材都可能出现一点；手艺也谈不上多精，做出来的东西希望凑合能看。

    我对模型和摄影的兴趣，应该最早来自电视上播的《神龙斗士》和《光能使者》。和很多同龄人一样，我小时候也买过一些动画片周边玩具，拿着那些机器人跑来跑去，模仿它们摆出战斗姿态。

    后来看到《哆啦A梦》的《超真实场景模型照片大作战》这一话，里面用特效场景拍摄玩具的玩法，像是给我打开了一扇新的门。那时我第一次意识到，原来可以用这样的方式，让喜欢的机械展示出自己的英姿。

    于是，我用油彩在自己的国产龙神号上做了像是泥巴糊墙一样的旧化；又用 A4 纸裁出楼房残骸的剪影，搭了一个极其简单的纯白场景；最后偷偷拿家里的卡片机，拍下了人生中第一张模玩照片。

    那张照片的效果，估计比大雄一开始拍的那张被小夫嘲笑的照片还拉。但我第一次看到，自己手上的玩具好像真的变得更接近原作里的印象了。那种自我满足感，让我一直记到现在。

    初中的时候，我在放学路上的报刊亭买了一本 2012 年 10 月刊的中文版《电击Hobby》。毫不意外地，我被上面刊登的拍摄特效和制作技法深深吸引。自那以后，我成了《电击Hobby》和《模工坊Hobby Japan》的忠实读者。直到后来电击停刊、我出国留学为止，几乎一期都没有落下过。

    那时的我非常想成为模型杂志里的模型师、摄影师和编辑：用相机和文字记录制作过程，再用修好的图片，让手中的玩具再现原作里的名场景。受限于经济条件，当时也只能素组+iTouch摄像头拍照+美图秀秀整个光束特效。很简陋，但自己玩得很开心。

    再往后，高中、本科、研究生、工作，我慢慢学会了喷涂等进阶制作技法，开始用 Photoshop，也买了更好的相机和镜头。但因为一些个人的臭毛病，我经常压抑自己真正想做的事。总觉得“来日方长”，总想着先去“努力”，先去做“正事”，好像这样就能缓解当下的焦虑。于是，在各种现实原因的阻碍下，模型和摄影断断续续中断了好几次。写下这段话的时候，我已经有一年多没有好好做过模型、拍过照片了。说实话，手很痒。
    现在是 2026 年 7 月 4 日，我即将迎来生活中的一个新阶段。不出意外的话，终于又可以继续制作模型了。
    作为这个转折的小小纪念，我整了这样一个看起来有点随机的个人博客，用来记录一下自己的这些爱好。目前这里的内容大多来自过去多年的存货；之后也会慢慢分享制作进度、完成品、手办、成品玩具，或者一些个人的碎碎念。
    这里算是一个给自己存档的地方。存档那些出片时的小小满足，也顺便纪念一下以前那些看起来有点不切实际、但其实一直没有完全放下的梦想。

ja:
  nav_home: "ホーム"
  nav_about: "プロフィール"
  tagline: "プラモ・フィギュア・写真・ゲーム・アニメ"
  bio: |
    こんにちは、Vanadium です。たぶん、あなたの周りにも一人はいそうな巨大ロボットアニメ好きです。
    この小さなサイトへようこそ。ここでは、自分で撮影したり制作したりした模型、フィギュア、完成品トイなどを少しずつ載せていくつもりです。好みはかなり雑多なので、いろいろな題材が出てくると思います。腕前も決して大したものではありませんが、なんとか見られるものになっていればうれしいです。
    模型と写真に興味を持つきっかけは、たぶんテレビで見ていた『魔神英雄伝ワタル』と『魔動王グランゾート』でした。同世代の多くの子どもと同じように、アニメ関連のおもちゃを買ってもらい、ロボットを手に持って走り回りながら、戦っているようなポーズを真似していました。
    その後、『ドラえもん』の「超リアル・ジオラマ作戦」のような、特撮セットでおもちゃを撮影する話を見て、新しい扉が開いたような気がしました。そのとき初めて、自分の好きなメカをこんな形でかっこよく見せられるのだと気づいたのです。
    そこで、国産の龍神丸に油絵の具で、泥を壁に塗りたくったようなウェザリングを入れました。さらにA4用紙を切って崩れたビルのシルエットを作り、真っ白なだけの簡単なセットを組み、家にあったコンパクトカメラをこっそり借りて、人生で初めての模型写真を撮りました。
    その写真の出来は、のび太が最初に撮ってスネ夫に笑われた写真よりひどかったかもしれません。それでも、自分の手元のおもちゃが、少しだけ原作の中の印象に近づいたように見えました。その小さな自己満足の感覚を、今でもよく覚えています。
    中学生の頃、学校帰りの新聞スタンドで、2012年10月号の中文版『電撃ホビーマガジン』を買いました。案の定、誌面に載っていた撮影用の特撮効果や制作技法に強く惹かれました。それ以来、『電撃ホビーマガジン』と『ホビージャパン』の熱心な読者になり、電撃が休刊し、自分が留学する頃までは、ほとんど欠かさず読んでいました。
    当時の私は、模型誌に出てくるモデラー、カメラマン、編集者のようになりたいと本気で思っていました。カメラと言葉で制作過程を記録し、仕上げた写真で、手元のおもちゃに原作の名場面を再現させる。とはいえ、経済的な制約もあって、実際にできたのは素組み、iTouchのカメラでの撮影、スマホアプリで作るビームエフェクトくらいでした。とても簡素でしたが、自分ではかなり楽しく遊んでいました。
    その後、高校、大学、大学院、仕事と進むうちに、エアブラシ塗装などの少し進んだ制作技法を覚え、Photoshopも使うようになり、カメラやレンズも少しずつ良いものを買うようになりました。ただ、自分の悪い癖もあって、本当にやりたいことをよく後回しにしてしまいました。「まだ先がある」と思い、「まずは努力しよう」「まずは正しいことをしよう」と考えれば、今の不安が少し和らぐ気がしていました。そうした考えや現実的な事情に阻まれて、模型と写真は何度も途切れ途切れになりました。この文章を書いている時点で、もう一年以上きちんと模型を作ったり写真を撮ったりしていません。正直、かなり手がうずいています。
    今は2026年7月4日で、私はもうすぐ生活の新しい段階を迎えようとしています。何もなければ、ようやくまた模型制作を続けられそうです。
    その小さな節目の記念として、少しランダムに見えるこの個人ブログを作りました。自分の趣味を記録しておくための場所です。今ここにある内容の多くは、これまで何年もためてきたストックですが、これからは制作途中のもの、完成品、フィギュア、完成品トイ、あるいは個人的なちょっとした雑記なども、少しずつ載せていくつもりです。
    ここは、自分のためのアーカイブのような場所です。写真がうまくいったときの小さな満足感を保存しておく場所であり、昔は少し現実離れして見えたけれど、実はまだ完全には手放していない夢を、そっと記念しておく場所でもあります。
